services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: medical-triage-api
    ports:
      - "8000:8000"
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp
      - MODEL_PATH=/shared/models/latest_model.pkl
    volumes:
      # Volume compartilhado para modelos
      - ./shared:/shared
      # Volume local para modelos (fallback)
      - ./models:/app/models
      # Volume para dados
      - ./data:/app/data
      # Volume para logs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - monitoring
      - shared
    restart: unless-stopped


  airflow-init:
    image: apache/airflow:3.3.1
    container_name: airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./shared:/shared
      - ./data:/opt/airflow/data
      - ./airflow/logs:/opt/airflow/logs
    # This command runs migrations and creates the admin user
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin"
    networks:
      - shared
    restart: "no"  # Ensures it runs only once


  airflow-apiserver:                      
    image: apache/airflow:3.3.1         
    container_name: airflow-apiserver
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-apiserver:8080/execution/
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./shared:/shared
      - ./data:/opt/airflow/data
      - ./airflow/logs:/opt/airflow/logs
    command: api-server
    networks:
      - shared
    depends_on:
      - airflow-scheduler
      - airflow-init
    restart: unless-stopped


  airflow-scheduler:
    image: apache/airflow:3.3.1
    container_name: airflow-scheduler
    depends_on:
      - airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-apiserver:8080/execution/
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./shared:/shared
      - ./data:/opt/airflow/data
      - ./airflow/logs:/opt/airflow/logs
    command: scheduler
    networks:
      - shared
    restart: unless-stopped


  airflow-dag-processor:
    image: apache/airflow:3.3.1
    container_name: airflow-dag-processor
    depends_on:
      - airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-apiserver:8080/execution/
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./shared:/shared
      - ./data:/opt/airflow/data
    command: dag-processor                   # ← Novo comando para processar DAGs
    networks:
      - shared
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    depends_on:
      - api
    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
    name: monitoring_network
  shared:
    driver: bridge
    name: shared_network