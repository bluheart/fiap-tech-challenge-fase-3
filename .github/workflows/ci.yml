name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
    PYTHON_VERSION: '3.13'

jobs:
  lint-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: $PYTHON_VERSION
    
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install the project
        run: uv sync --locked --all-extras --dev
      
      - name: Run Linter
        run: uv run ruff check src/ tests/
  
  test:
    runs-on: ubuntu-latest
    needs: lint-code
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: $PYTHON_VERSION
    
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run Test
        run: pytest tests/
