name: CI

on:
  push:
    branches: [ main, dev2 ]
  pull_request:
    branches: [ main ]


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
    
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install the project
        run: uv sync --locked --all-extras --dev
      
      - name: Run Linter
        run: uv run ruff check app/ tests/
  
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7
    
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run Test
        run: uv run pytest tests/ -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Build Docker image
      run: |
        docker build -t medical-classifier:${{ github.sha }} .
    
    - name: Docker image test
      run: |
        docker run -d -p 8000:8000 --name test-container medical-classifier:${{ github.sha }}
        sleep 10
        curl http://localhost:8000/health
        docker stop test-container 